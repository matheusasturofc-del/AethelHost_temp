<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração — AethelHost</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html"><img class="logo" src="assets/icon.svg" alt="">Aethel<span>Host</span></a>
      <nav class="topnav">
        <a href="servers.html">Servidores</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Administração</h1>
      <a class="btn" href="login.html?setup=1">Configurar logins e e-mail</a>
      <input type="text" id="adSearch" placeholder="Buscar conta, e-mail ou servidor…" maxlength="60" autocomplete="off" style="max-width:320px">
    </div>
    <div class="error" id="adErr"></div>
    <div class="info-grid" id="adTotals"></div>
    <div id="adExplore" style="margin-top:20px"></div>
    <div id="adSupport" style="margin-top:20px"></div>
    <div id="adList" style="margin-top:20px"></div>
    <p class="muted small" id="adNote" hidden>Só leitura. Você vê aqui as contas e os servidores de todo mundo; para mexer em um servidor, a própria pessoa usa o painel dela.</p>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const PROVIDER = { google: "Google", microsoft: "Microsoft", github: "GitHub", discord: "Discord", custom: "Outro" };
    const providerName = (id) => id === "password" ? ((document.documentElement.lang || "").startsWith("en") ? "Email & password" : "E-mail e senha") : (PROVIDER[id] || id);
    const STATE = { offline: "Offline", starting: "Iniciando…", online: "Online", stopping: "Parando…" };
    let data = null;
    let mergeFor = null;  // { id, target }: qual caixa está com a mesclagem aberta (fica guardado entre as atualizações de 5 s)

    function fmtRam(mb) { return mb >= 1024 ? (mb / 1024).toFixed(mb % 1024 ? 1 : 0) + " GB" : mb + " MB"; }
    function fmtWhen(iso) {  // "2026-09-20T19:28:23" (hora local do PC) -> data e hora no idioma escolhido
      if (!iso) return "—";
      return fmtDate(new Date(iso).getTime() / 1000);
    }

    function avatar(u) {
      const fallback = h("span", { class: "avatar", translate: "no" }, (u.name || "?").trim().charAt(0).toUpperCase());
      if (!u.avatar) return fallback;
      const img = h("img", { class: "avatar", src: u.avatar, alt: "", referrerPolicy: "no-referrer" });
      img.addEventListener("error", () => img.replaceWith(fallback));
      return img;
    }

    function serverRow(s) {
      return h("div", { class: "row" },
        h("div", { class: "row-main" },
          h("strong", { translate: "no" }, s.name),
          h("small", { translate: "no" }, `${s.ip} · ${s.software} ${s.version} · :${s.port}`)),
        s.public ? h("span", { class: "badge on" }, "Endereço público") : null,
        s.listed ? h("span", { class: "badge on" }, "No Explorar") : null,
        s.verified ? h("span", { class: "badge on" }, "Verificado") : null,
        h("button", { class: "btn", type: "button", style: "padding:3px 10px;font-size:12px", onclick: () => setTrust(s) }, s.verified ? "Tirar selo" : "Dar selo"),
        h("span", { class: "badge" }, s.plan === "vps" ? "VPS" : "Grátis"),
        h("span", { class: "badge", translate: "no" }, fmtRam(s.ramMb)),
        h("span", { class: "status " + s.state }, STATE[s.state]),
        h("span", { class: "muted", style: "min-width:64px;text-align:right" }, s.state === "online" ? `${s.players} 👤` : ""));
    }

    // Mesclar: esta conta (drop) entra na conta escolhida (keep): logins, servidores e chave SSH passam para ela.
    function mergeBox(u) {
      if (!mergeFor || mergeFor.id !== u.id) {
        return h("div", { style: "margin-top:10px" }, h("button", { class: "btn", type: "button", style: "padding:5px 12px;font-size:13px",
          onclick: () => { mergeFor = { id: u.id, target: "" }; render(); } }, "Mesclar em outra conta…"));
      }
      const others = data.users.filter((x) => x.id !== u.id);
      const select = h("select", { onchange: (ev) => { mergeFor.target = ev.target.value; } },
        h("option", { value: "" }, "Escolha a conta que fica…"),
        ...others.map((x) => h("option", { value: x.id, selected: x.id === mergeFor.target, translate: "no" }, `${x.name}${x.username ? " (@" + x.username + ")" : ""} — ${x.email || providerName(x.provider)}`)));
      return h("div", { class: "uri-row", style: "margin-top:10px;flex-wrap:wrap" }, select,
        h("button", { class: "btn btn-danger", type: "button", onclick: async () => {
          if (!mergeFor.target) return $("adErr").replaceChildren(document.createTextNode("Escolha a conta que fica."));
          if (!(await confirmBox("Mesclar estas duas contas numa só? A conta desta caixa deixa de existir e os logins e servidores dela passam para a conta escolhida. Não dá para desfazer.", { title: "Você tem certeza?", ok: "Mesclar", danger: true }))) return;
          try { await api("POST", "/admin/merge", { keep: mergeFor.target, drop: u.id }); mergeFor = null; $("adErr").textContent = ""; await load(); }
          catch (e) { $("adErr").textContent = e.message; }
        } }, "Mesclar"),
        h("button", { class: "btn", type: "button", onclick: () => { mergeFor = null; render(); } }, "Cancelar"));
    }

    // ---- Explorar: selo "Confiável por AethelHost", remoção e denúncias
    async function setTrust(s) {
      let note = "";
      if (!s.verified) {
        note = await promptBox(`Dar o selo Confiável por AethelHost ao servidor "${s.name}"? Só dê depois de testar: entra, sem mods maliciosos, sem golpe. Nota para você (opcional):`, { title: "Dar o selo", ok: "Dar selo", placeholder: "ex.: testado em 26/09" });
        if (note === null) return;
      } else if (!(await confirmBox(`Tirar o selo do servidor "${s.name}"?`, { ok: "Tirar selo", danger: true }))) return;
      try { await api("POST", "/admin/explore", { id: s.id, verified: !s.verified, note }); $("adErr").textContent = ""; await load(); }
      catch (e) { $("adErr").textContent = e.message; }
    }

    async function exploreAct(s, body, ask) {
      if (ask && !(await confirmBox(ask, { ok: "Confirmar", danger: true }))) return;
      try { await api("POST", "/admin/explore", { id: s.id, ...body }); $("adErr").textContent = ""; await load(); }
      catch (e) { $("adErr").textContent = e.message; }
    }

    let exploreData = null, supportData = null, supportDraft = {};
    function exploreSection() {
      const list = exploreData ? exploreData.servers : [];
      const reported = list.filter((s) => s.reports.length).length;
      const rows = list.map((s) => h("div", { style: "padding:12px 0;border-top:1px solid var(--border)" },
        h("div", { class: "row", style: "border:0;padding:0" },
          h("div", { class: "row-main" },
            h("strong", { translate: "no" }, s.name),
            h("small", { translate: "no" }, `${s.ip} · ${s.softwareLabel} ${s.version} · ${s.plan === "vps" ? "VPS" : "Grátis"} · @${s.owner}`),
            s.verified && s.verifiedNote ? h("small", {}, "Nota: ", h("span", { translate: "no" }, s.verifiedNote)) : null),
          s.listed && !s.blocked ? h("span", { class: "badge on" }, "No Explorar") : null,
          s.blocked ? h("span", { class: "badge pending" }, "Removido") : null,
          s.autoHidden ? h("span", { class: "badge pending" }, "Oculto por denúncias") : null,
          s.verified ? h("span", { class: "badge on" }, "Verificado") : null,
          h("span", { class: "status " + s.state }, STATE[s.state])),
        s.reports.length ? h("div", { style: "margin:8px 0 0" }, ...s.reports.map((r) => h("div", { class: "small", style: "margin:2px 0" },
          h("b", {}, r.label), r.note ? h("span", { translate: "no" }, ": " + r.note) : null, h("span", { class: "muted" }, " · @" + r.by + " · ", fmtDate(r.ts))))) : null,
        h("div", { class: "btn-row", style: "margin-top:8px" },
          h("button", { class: "btn", type: "button", onclick: () => setTrust(s) }, s.verified ? "Tirar selo" : "Dar selo"),
          s.blocked
            ? h("button", { class: "btn", type: "button", onclick: () => exploreAct(s, { blocked: false }) }, "Liberar no Explorar")
            : h("button", { class: "btn btn-danger", type: "button", onclick: () => exploreAct(s, { blocked: true, dismiss: true }, `Tirar "${s.name}" do Explorar? O dono não consegue anunciar de novo, e recebe um aviso.`) }, "Tirar do Explorar"),
          s.reports.length ? h("button", { class: "btn", type: "button", onclick: () => exploreAct(s, { dismiss: true }) }, "Descartar denúncias") : null)));
      return h("div", { class: "card", style: "padding:20px" },
        h("h2", { style: "margin:0 0 4px;font-size:19px" }, "Explorar"),
        h("p", { class: "muted small", style: "margin:0 0 6px" }, `${list.length} servidor${list.length === 1 ? "" : "es"}` + (reported ? `, ${reported} com denúncia` : "") + ". Com 5 denúncias de pessoas diferentes o servidor sai da lista até você olhar."),
        rows.length ? rows : h("p", { class: "muted" }, "Nenhum servidor anunciado ainda."));
    }

    // ---- Suporte
    const TOPIC = { account: "Conta e login", server: "Meu servidor", vps: "VPS", backup: "Backups e Drive", explore: "Explorar", bug: "Erro no site", other: "Outro assunto" };
    const TSTATE = { open: "Aguardando você", answered: "Respondida", closed: "Encerrada" };
    async function supportAct(t, text, close) {
      try { await api("POST", "/admin/support/reply", { id: t.id, text, close }); $("adErr").textContent = ""; supportDraft = {}; await loadExtra(true); }
      catch (e) { $("adErr").textContent = e.message; }
    }
    function supportSection() {
      const list = supportData ? supportData.tickets : [];
      const open = list.filter((t) => t.status === "open").length;
      const cards = list.map((t) => {
        const box = h("textarea", { rows: 2, maxlength: 2000, placeholder: "Sua resposta…", value: supportDraft[t.id] || "", oninput: (ev) => { supportDraft[t.id] = ev.target.value; } });
        return h("div", { style: "padding:12px 0;border-top:1px solid var(--border)" },
          h("div", { class: "row", style: "border:0;padding:0 0 6px" },
            h("div", { class: "row-main" },
              h("strong", { translate: "no" }, t.subject),
              h("small", {}, h("span", { translate: "no" }, `${t.user.name}${t.user.username ? " @" + t.user.username : ""} · ${t.user.email || ""}`), " · ", TOPIC[t.topic] || t.topic)),
            h("span", { class: "badge" + (t.status === "open" ? " pending" : "") }, TSTATE[t.status])),
          ...t.messages.map((m) => h("div", { class: "support-msg " + m.from }, h("small", { class: "muted" }, m.from === "team" ? "Equipe" : "Pessoa", " · ", fmtDate(m.ts)), h("div", { translate: "no", style: "white-space:pre-wrap;overflow-wrap:anywhere" }, m.text))),
          t.status === "closed" ? null : h("div", {}, box,
            h("div", { class: "btn-row", style: "margin-top:8px" },
              h("button", { class: "btn btn-primary", type: "button", onclick: () => box.value.trim() ? supportAct(t, box.value, false) : null }, "Responder"),
              h("button", { class: "btn", type: "button", onclick: () => supportAct(t, box.value, true) }, "Responder e encerrar"))));
      });
      return h("div", { class: "card", style: "padding:20px" },
        h("h2", { style: "margin:0 0 4px;font-size:19px" }, "Suporte"),
        h("p", { class: "muted small", style: "margin:0 0 6px" }, `${list.length} conversa${list.length === 1 ? "" : "s"}` + (open ? `, ${open} esperando resposta` : "") + ". Quem recebe a resposta é avisado no sino."),
        cards.length ? cards : h("p", { class: "muted" }, "Nenhuma mensagem ainda."));
    }

    let extraSig = "";
    function drawExtra(force) {
      const focus = document.activeElement && document.activeElement.closest && document.activeElement.closest("#adSupport");
      const sig = JSON.stringify([exploreData, supportData, document.documentElement.lang]);
      if (!force && (sig === extraSig || focus || Object.values(supportDraft).some(Boolean))) return;
      extraSig = sig;
      $("adExplore").replaceChildren(exploreSection());
      $("adSupport").replaceChildren(supportSection());
    }
    async function loadExtra(force) {
      try {
        [exploreData, supportData] = await Promise.all([api("GET", "/admin/explore"), api("GET", "/admin/support")]);
        drawExtra(force);
      } catch { /* o erro principal já aparece em load() */ }
    }

    function accountCard(u) {
      const running = u.servers.filter((s) => s.state !== "offline").length;
      return h("div", { class: "card", style: "margin-bottom:14px;padding:20px" },
        h("div", { class: "row", style: "border:0;padding:0 0 10px" },
          avatar(u),
          h("div", { class: "row-main" },
            h("strong", { translate: "no" }, u.name, u.username ? h("span", { class: "muted", style: "font-weight:400" }, " @" + u.username) : null, u.admin ? h("span", { class: "badge on", translate: "yes" }, "Administrador") : null),
            h("small", {}, u.email ? h("span", { translate: "no" }, u.email) : "sem e-mail", " · ", h("span", { translate: "no" }, (u.methods || [u.provider]).map(providerName).join(" + ")))),
          h("div", { class: "row-main", style: "text-align:right;flex:none" },
            h("small", {}, "Entrou em ", h("span", { translate: "no" }, fmtWhen(u.created))),
            h("small", {}, "Último login ", h("span", { translate: "no" }, fmtWhen(u.lastLogin))),
            h("small", {}, u.sessions === 1 ? "1 sessão aberta" : `${u.sessions} sessões abertas`))),
        h("p", { class: "muted small", style: "margin:0 0 4px" },
          u.servers.length === 0 ? "Nenhum servidor." : `${u.servers.length === 1 ? "1 servidor" : u.servers.length + " servidores"}, ${running} ligado${running === 1 ? "" : "s"} agora`),
        ...u.servers.map(serverRow),
        data.users.length > 1 ? mergeBox(u) : null);
    }

    function render() {
      const q = $("adSearch").value.trim().toLowerCase();
      const t = data.totals;
      $("adTotals").replaceChildren(
        ...[["Contas", t.users], ["Servidores", t.servers], ["Ligados agora", t.running], ["Jogadores online", t.players], ["RAM em uso neste PC", fmtRam(t.ramInUseMb)]]
          .map(([label, value]) => h("div", { class: "info" }, h("small", {}, label), h("strong", {}, String(value)))));
      const match = (u) => !q || [u.name, u.email, providerName(u.provider), u.username || "", ...u.servers.flatMap((s) => [s.name, s.ip])].some((x) => (x || "").toLowerCase().includes(q));
      const cards = data.users.filter(match).map(accountCard);
      if (data.orphans.length && !q) {
        cards.push(h("div", { class: "card", style: "margin-bottom:14px;padding:20px" },
          h("p", { class: "muted small", style: "margin:0 0 4px" }, "Servidores sem conta (a conta dono não existe mais)"),
          ...data.orphans.map(serverRow)));
      }
      $("adList").replaceChildren(...(cards.length ? cards : [h("p", { class: "muted" }, "Nenhuma conta encontrada.")]));
      $("adNote").hidden = false;
    }

    async function load() {
      try {
        data = await api("GET", "/admin/overview");
        $("adErr").textContent = "";
        render();
        loadExtra();
      } catch (e) {
        if (e.status === 403) {
          $("adTotals").replaceChildren();
          $("adList").replaceChildren(h("div", { class: "empty" }, h("h2", {}, "Só para o administrador"),
            h("p", {}, "Esta página é do administrador do AethelHost (a primeira conta criada)."),
            h("a", { class: "btn btn-primary", href: "servers.html" }, "Ver meus servidores")));
          clearInterval(timer);
        } else {
          $("adErr").textContent = e.message;
        }
      }
    }

    $("adSearch").addEventListener("input", () => data && render());
    window.addEventListener("langchange", () => { if (data) render(); drawExtra(true); });
    const timer = setInterval(load, 5000);
    load();
  </script>
  <script src="js/i18n-en.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
