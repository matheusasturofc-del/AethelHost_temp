<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servidores — AethelHost</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html"><img class="logo" src="assets/icon.svg" alt="">Aethel<span>Host</span></a>
      <nav class="topnav">
        <a href="servers.html">Servidores</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Seus servidores</h1>
      <a class="btn btn-primary" href="create.html">+ Criar servidor</a>
    </div>
    <div id="list"></div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/look.js"></script>
  <script>
    const list = document.getElementById("list");

    function render(servers) {
      if (servers.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <h2>Nenhum servidor ainda</h2>
            <p>Crie o primeiro e comece a jogar.</p>
            <a class="btn btn-primary" href="create.html">Criar servidor</a>
          </div>`;
        return;
      }
      list.replaceChildren(h("div", { class: "server-grid" }, servers.map((s) =>
        h("a", { class: "server-card", href: `panel.html?id=${encodeURIComponent(s.id)}` },
          h("div", { class: "card-top" },
            h("img", { class: "card-icon", src: iconUrl(s), alt: "" }),
            h("div", { class: "card-title" }, h("h3", {}, s.name), h("div", { class: "sub" }, mcNodes(s.subtitle, { trim: true })))),
          h("div", { class: "addr" }, s.publicName),
          s.shared ? h("div", { class: "muted small", style: "margin:0 0 8px" }, "Compartilhado por ", h("b", { translate: "no" }, s.ownerName)) : null,
          h("div", { class: "card-foot" },
            h("span", { class: "status " + s.runtime.state }, STATUS_LABEL[s.runtime.state]),
            h("span", {}, s.shared ? h("span", { class: "badge shared" }, "Compartilhado") : null, " ", h("span", { class: "badge" }, `${s.softwareLabel} ${s.version}`), " ", h("span", { class: "badge" }, s.plan === "vps" ? "VPS" : "Grátis")))))));
    }

    async function load() {
      try {
        render(await api("GET", "/servers"));
      } catch (e) {
        list.innerHTML = `<div class="empty"><h2>Backend fora do ar</h2><p>${esc(e.message)}</p></div>`;
      }
    }

    load();
    setInterval(load, 3000);
    window.addEventListener("langchange", load);
    window.addEventListener("bh-servers-changed", load);  // aceitou um convite no sino: o servidor novo aparece já
  </script>
  <script src="js/i18n-en.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
